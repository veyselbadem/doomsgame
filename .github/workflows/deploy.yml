name: Deploy (FTP)

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Yüklenecek dosyalar ve klasörler
          local-dir: ./
          # Sadece çalışma zamanında gerekenleri gönderelim (Node.js hosting için)
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            src/
            tests/
            .gitignore
            README.md
            tsconfig.json
            server.ts
            *.ts
